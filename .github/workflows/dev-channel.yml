name: Refresh dev channel

# Regenerate the `dev` branch: main, plus a single generated file that points
# the actions at unreleased posit-cli and rsconnect-python. The branch is
# rebuilt from scratch on every push rather than merged forward, so it is
# always exactly one commit ahead of main and can never drift or conflict.
#
# Consumers opt in by changing `@main` to `@dev` in their `uses:` line.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Serialize force-pushes so two rapid merges to main can't race and leave `dev`
# built on the older commit.
concurrency:
  group: dev-channel
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Rebuild dev branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B dev HEAD

          # scripts/install-posit-cli.sh sources this file when present. The
          # `:-` defaults let a caller still override either spec from the
          # workflow environment while on the dev channel.
          cat > scripts/dev-refs.env <<'EOF'
          # Generated by .github/workflows/dev-channel.yml -- do not edit on this
          # branch; it is overwritten on every push to main.
          POSIT_CLI_SPEC="${POSIT_CLI_SPEC:-git+https://github.com/posit-dev/posit-cli}"
          RSCONNECT_PYTHON_SPEC="${RSCONNECT_PYTHON_SPEC:-rsconnect-python @ git+https://github.com/posit-dev/rsconnect-python}"
          EOF

          # -f: the file is gitignored so it can't be committed to main by accident.
          git add -f scripts/dev-refs.env
          git commit -m "chore: dev channel overlay on $(git rev-parse --short HEAD)"
          git push --force origin dev
